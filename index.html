<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121a21">
  <title>迷霧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">

  <!-- 標題 -->
  <section class="screen" id="title">
    <div class="title-map" id="titleMap" aria-hidden="true"></div>
    <div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title-inner">
      <h1 class="logo">迷霧</h1>
      <p class="tagline">從南港展覽館出發，搭遍台北捷運。<br>每條路線的終點，都留著一件東西。</p>
      <div class="title-actions" id="titleActions"></div>
      <p class="title-clock" id="titleClock"></p>
    </div>
  </section>

  <!-- 選角色 -->
  <section class="screen" id="charSelect">
    <header class="step-head">
      <button class="back" id="charBack" aria-label="返回">‹</button>
      <h2>選擇主角</h2>
    </header>
    <div class="char-cards" id="charCards"></div>
    <div class="step-foot"><button class="btn primary" id="charConfirm" disabled>選一位主角</button></div>
  </section>

  <!-- 遊戲 -->
  <section class="screen" id="game">
    <div class="scene" id="scene"></div>
    <header class="hud">
      <div class="hud-me">
        <div class="hud-avatar" id="hudAvatar"></div>
        <div><b id="hudName"></b><small id="hudWhere"></small></div>
      </div>
      <div class="hud-time">
        <b id="hudTime">--:--</b>
        <small id="hudDate"></small>
        <span class="hud-stats" id="hudStats"></span>
      </div>
      <nav class="hud-btns">
        <button id="btnMap">路網圖</button>
        <button id="btnQuest">任務 <span id="hudQuests">0</span></button>
        <button id="btnRecord">紀錄</button>
        <button id="btnPhone">手機 <span id="hudPhone"></span></button>
        <button id="btnBag">背包 <span id="hudItems">0/6</span></button>
        <button id="btnSound" aria-pressed="true">音效 開</button>
      </nav>
    </header>
    <div class="panel" id="panel"></div>
    <button class="action-btn" id="actionBtn" hidden></button>
    <div class="joystick" id="joystick" aria-label="移動搖桿"><span class="knob"></span></div>
    <button class="run-btn" id="runBtn" aria-pressed="false">跑</button>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <p class="controls-hint" id="controlsHint">方向鍵／WASD 走動　Shift 跑步　拖曳畫面轉視角　E 互動</p>
  </section>

  <!-- 路網圖 -->
  <div class="modal" id="mapModal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
      <header><h3 id="mapTitle">台北捷運 3D 路網</h3><span id="mapStats"></span><button class="x" data-close="mapModal" aria-label="關閉">×</button></header>
      <div class="map-box map3d-box">
        <div class="map3d" id="map3d"></div>
        <div class="zoom">
          <button id="mapZoomIn" aria-label="放大">＋</button><button id="mapZoomOut" aria-label="縮小">－</button>
          <button id="mapRotL" aria-label="向左旋轉">⟲</button><button id="mapRotR" aria-label="向右旋轉">⟳</button>
          <button id="mapHere" aria-label="回到目前位置">◎</button><button id="mapAll" aria-label="看整個路網">全</button>
        </div>
        <div class="map-card" id="mapCard" hidden></div>
        <div class="compass" aria-hidden="true"><span id="compassN">N</span></div>
        <div class="map-lines" id="mapLines" aria-label="只看某條路線"></div>
      </div>
      <p class="map-legend"><span class="lg-me"></span>你在這裡　<span class="lg-fog"></span>還沒去過的車站藏在霧裡　高架在地面上、地下段在地面下　拖曳移動、滾輪或雙指縮放、右鍵拖曳或雙指旋轉</p>
    </div>
  </div>

  <!-- 任務 -->
  <div class="modal" id="questLog" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="questTitle">
      <header><h3 id="questTitle">任務</h3><span id="questCount"></span><button class="x" data-close="questLog" aria-label="關閉">×</button></header>
      <div id="questBody"></div>
    </div>
  </div>

  <!-- 紀錄：角色、探索、評價、收藏、聲望、人物 -->
  <div class="modal" id="record" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recordTitle">
      <header><h3 id="recordTitle">紀錄</h3><button class="x" data-close="record" aria-label="關閉">×</button></header>
      <div id="recordBody"></div>
    </div>
  </div>

  <!-- 背包 -->
  <div class="phone-wrap" id="phone" hidden>
    <div class="phone" role="dialog" aria-modal="true" aria-label="手機">
      <button class="x phone-x" id="phoneClose" aria-label="關閉">×</button>
      <div id="phoneBody"></div>
    </div>
  </div>
  <div class="modal" id="bag" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bagTitle">
      <header><h3 id="bagTitle">背包</h3><button class="x" data-close="bag" aria-label="關閉">×</button></header>
      <div id="bagBody"></div>
    </div>
  </div>

  <!-- 獲得物品 -->
  <div class="modal item-overlay" id="itemOverlay" hidden></div>

  <!-- 對話 -->
  <div class="dialog" id="dialog" hidden></div>

  <!-- 傳送轉場 -->
  <div class="tp-fx" id="tpFx" hidden></div>

  <!-- 停駛時段 -->
  <div class="closed" id="closedOverlay" hidden>
    <div class="fog" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="closed-inner">
      <p class="closed-range" id="closedRange"></p>
      <h2 id="closedTitle"></h2>
      <p id="closedBody"></p>
      <div class="closed-btns">
        <button class="btn ghost" id="closedMap">查看路網圖</button>
        <button class="btn ghost" id="closedTitleBtn">回到標題</button>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/time.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/story.js"></script>
  <script src="js/outfits.js"></script>
  <script src="js/human3d.js"></script>
  <script src="js/trains.js"></script>
  <script src="js/station3d.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/npcs.js"></script>
  <script src="js/sidequests.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/gold.js"></script>
  <script src="js/life.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/map3d.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
